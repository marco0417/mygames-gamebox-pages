    <script>
      // 首屏皮肤防闪：在任何内容绘制前同步决定皮肤并挂到 body，避免先蜜梨后切换的 FOUC
      (function(){
        var DEFAULT_SKIN = 'default';
        var VALID = ['default','mili','pirate','knight'];
        function resolveSkin(){
          try {
            var p = new URLSearchParams(location.search).get('skin');
            if (p && VALID.indexOf(p) >= 0) return p;
            var s = localStorage.getItem('gamebox:skin');
            if (s && VALID.indexOf(s) >= 0) return s;
          } catch(e){}
          return DEFAULT_SKIN;
        }
        function isDark(){
          var t = 'light';
          try { t = localStorage.getItem('gamebox:theme') || 'light'; } catch(e){}
          if (t === 'auto') { try { t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light'; } catch(e){} }
          return t === 'dark';
        }
        var skin = resolveSkin();
        document.body.className = 'skin-' + skin + (isDark() ? ' dark' : '');
        window.__SKIN__ = skin;
      })();
    </script>
